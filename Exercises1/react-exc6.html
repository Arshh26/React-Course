<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercise 01</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>

    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      const currDate = dayjs().format("MMMM D");
      console.log(currDate);

      const currTime = dayjs().format("HH:mm:ss");

      const paragraph = (
        <div>
          <p>Today is {currDate}</p>
          <p>Current Time {currTime}</p>
        </div>
      );

      const display = document.querySelector(".js-container");
      ReactDOM.createRoot(display).render(paragraph);
    </script>
  </body>
</html>
